<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — File Not Found | NextGenRedTeam</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/index.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      color: var(--neon-pink);
      text-shadow: 0 0 40px rgba(255, 45, 85, 0.5), 0 0 80px rgba(255, 45, 85, 0.2);
      letter-spacing: -4px;
      margin-bottom: 8px;
    }
    .error-label {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .error-msg {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .glitch-line {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--neon-cyan);
      margin-bottom: 24px;
      animation: flicker 3s step-end infinite;
    }
    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.2; }
      97% { opacity: 1; }
      98% { opacity: 0.1; }
      99% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="noise-overlay"></div>
  <div class="grid-bg"></div>
  <div class="grid-glow"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="logo-container" id="logo-link">
        <img src="/assets/logos/logo2.png" id="ngrt-logo" alt="NGRT Logo" class="logo-img">
      </a>
      <div class="nav-links">
        <a href="/index.html#services" class="nav-link">[01] Services</a>
        <a href="/index.html#tools" class="nav-link">[02] Tools</a>
        <a href="/blog/index.html" class="nav-link">[03] Blog</a>
        <a href="https://calendar.proton.me/bookings#HVEHryH4oOT8O4hzE1WTkx71-bIihVp1FCAnLpSB-dM=" target="_blank" class="nav-link-btn button">[Collab &amp; Media]</a>
      </div>
      <button class="nav-burger" id="nav-burger" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="error-page">
    <div>
      <div class="glitch-line">// ERROR // PATH_NOT_FOUND // NGRT_RECON_FAILED</div>
      <div class="error-code">404</div>
      <div class="error-label">Target Not Found</div>
      <p class="error-msg">
        The requested path does not exist on this server. It may have moved, been archived, or your link might be broken.
      </p>
      <div class="error-actions">
        <a href="/index.html" class="button border-cyan">Return to Base</a>
        <a href="/blog/index.html" class="button border-pink">Threat Lab Blog</a>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
